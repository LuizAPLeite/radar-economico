name: Coleta de dados (produção)

# Todo dia às 9h de Brasília (12h UTC), e também por disparo manual:
# aba Actions → "Coleta de dados (produção)" → Run workflow.
#
# O agendamento só roda quando a variável do repositório COLETA_AGENDADA
# for "true" (Settings → Secrets and variables → Actions → Variables). Ela
# fica desligada até o deploy: sem banco de produção, a coleta falharia
# todo dia. O disparo manual funciona sempre.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

# Uma coleta por vez; uma nova espera a anterior terminar, nunca a interrompe.
concurrency:
  group: data-production
  cancel-in-progress: false

# Só leitura do código: nenhum job aqui precisa escrever no repositório.
permissions:
  contents: read

jobs:
  collect:
    name: Migrations, coleta e pipeline
    if: github.event_name == 'workflow_dispatch' || vars.COLETA_AGENDADA == 'true'
    runs-on: ubuntu-latest
    # A primeira coleta da ANP (12 meses, servidor lento) leva vários minutos;
    # as seguintes, incrementais, poucos.
    timeout-minutes: 30
    # A credencial do banco (connection string DIRETA do Neon, sem "-pooler",
    # em Settings → Secrets and variables → Actions) só entra nos passos que
    # falam com o banco, e não no job inteiro: as Actions de terceiros
    # (setup-go, setup-uv) não a recebem. O GitHub esconde o valor nos logs.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Confere o secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Cadastre o secret DATABASE_URL em Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm -v "$PWD/db/migrations:/migrations:ro" \
            migrate/migrate:v4.18.3 -path=/migrations -database="$DATABASE_URL" up

      # As ferramentas são instaladas ANTES da coleta: se uma fonte falhar, o
      # passo seguinte é pulado, e o pipeline (que roda mesmo assim) ficaria
      # sem o uv. Foi o que travou a produção de 20 a 25/11/2026.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      # O IBGE fica de fora: ele recusa conexões vindas de fora do Brasil, e os
      # servidores do Actions ficam nos EUA. Os municípios quase nunca mudam;
      # são carregados a partir de uma máquina no Brasil (ver o README, Deploy).
      - name: Coleta (BCB e Brent)
        run: go run ./collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COLLECTOR_SOURCES: bcb_sgs,fred

      # Desde 20/11/2026 o gov.br derruba as conexões vindas do Actions (como o
      # IBGE já fazia). A coleta da ANP continua sendo tentada todo dia, mas a
      # falha vira AVISO, não erro: o /health/data acusa quando os dados da ANP
      # passarem do prazo. Coletar de uma máquina no Brasil resolve (README).
      - name: Coleta (ANP e série da ANP; bloqueio vira aviso)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if ! go run ./collector; then
            echo "::warning::A ANP recusou a conexão vinda do GitHub; os dados da ANP não foram atualizados hoje."
            exit 1
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COLLECTOR_SOURCES: anp,anp_serie

      # Roda mesmo se a coleta de alguma fonte falhou: as outras podem ter
      # trazido dados novos, e cada job do pipeline só lê o que deu certo.
      - name: Pipeline (raw → staging → mart)
        if: ${{ !cancelled() }}
        working-directory: pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --locked --no-dev radar-pipeline
