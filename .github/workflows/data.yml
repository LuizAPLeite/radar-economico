name: Coleta de dados (produção)

# Todo dia às 9h de Brasília (12h UTC), e também por disparo manual:
# aba Actions → "Coleta de dados (produção)" → Run workflow.
#
# O agendamento só roda quando a variável do repositório COLETA_AGENDADA
# for "true" (Settings → Secrets and variables → Actions → Variables). Ela
# fica desligada até o deploy: sem banco de produção, a coleta falharia
# todo dia. O disparo manual funciona sempre.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

# Uma coleta por vez; uma nova espera a anterior terminar, nunca a interrompe.
concurrency:
  group: data-production
  cancel-in-progress: false

jobs:
  collect:
    name: Migrations, coleta e pipeline
    if: github.event_name == 'workflow_dispatch' || vars.COLETA_AGENDADA == 'true'
    runs-on: ubuntu-latest
    # A primeira coleta da ANP (12 meses, servidor lento) leva vários minutos;
    # as seguintes, incrementais, poucos.
    timeout-minutes: 30
    env:
      # Connection string DIRETA do Neon (sem "-pooler"), cadastrada em
      # Settings → Secrets and variables → Actions. O GitHub esconde o valor nos logs.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Confere o secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Cadastre o secret DATABASE_URL em Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Migrations
        run: |
          docker run --rm -v "$PWD/db/migrations:/migrations:ro" \
            migrate/migrate:v4.18.3 -path=/migrations -database="$DATABASE_URL" up

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Coleta (BCB, IBGE e ANP)
        run: go run ./collector

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Roda mesmo se a coleta de alguma fonte falhou: as outras podem ter
      # trazido dados novos, e cada job do pipeline só lê o que deu certo.
      - name: Pipeline (raw → staging → mart)
        if: ${{ !cancelled() }}
        working-directory: pipeline
        run: uv run --locked --no-dev radar-pipeline
