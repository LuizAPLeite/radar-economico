name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela execuções antigas do mesmo branch quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (collector, api)
    runs-on: ubuntu-latest
    # Postgres para os testes de integração (ex.: collector/internal/store).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://radar:radar@localhost:5432/radar?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l collector api)
          if [ -n "$unformatted" ]; then
            echo "Arquivos fora do gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./collector/... ./api/...
      - name: Aplica as migrations no banco de teste
        run: |
          docker run --rm --network host -v "$PWD/db/migrations:/migrations:ro" \
            migrate/migrate:v4.18.3 -path=/migrations -database="$TEST_DATABASE_URL" up
      - run: go test -race ./collector/... ./api/...
      - name: Build da imagem do collector
        run: docker build -t collector ./collector

  python:
    name: Python (pipeline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    # Postgres para os testes de integração do job (tests/test_bcb_job_integration.py).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://radar:radar@localhost:5432/radar?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - name: Aplica as migrations no banco de teste
        working-directory: .
        run: |
          docker run --rm --network host -v "$PWD/db/migrations:/migrations:ro" \
            migrate/migrate:v4.18.3 -path=/migrations -database="$TEST_DATABASE_URL" up
      - run: uv run pytest -rs
      - name: Build da imagem do pipeline
        run: docker build -t pipeline .

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  migrations:
    name: Migrations (up/down/up)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://radar:radar@localhost:5432/radar?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Aplica, reverte e reaplica todas as migrations
        run: |
          migrate() {
            docker run --rm --network host -v "$PWD/db/migrations:/migrations:ro" \
              migrate/migrate:v4.18.3 -path=/migrations -database="$DATABASE_URL" "$@"
          }
          migrate up
          migrate down -all
          migrate up
      - name: Confere os schemas
        run: |
          schemas=$(psql "$DATABASE_URL" -Atc "select string_agg(nspname, ',' order by nspname) from pg_namespace where nspname in ('raw','staging','mart')")
          echo "schemas: $schemas"
          test "$schemas" = "mart,raw,staging"
