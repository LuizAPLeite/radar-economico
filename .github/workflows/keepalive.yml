name: Mantém a API acordada

# A API roda no plano grátis do Render, que desliga o serviço após 15 min
# sem requisições (e leva ~1 min para religar). Consultar o /health a cada
# 10 min mantém a API no ar: as 750 horas grátis do mês cobrem 24 horas por
# dia. O /health não consulta o banco, então o Neon continua dormindo.
#
# Só roda quando a variável do repositório API_URL estiver definida
# (Settings → Secrets and variables → Actions → Variables), por exemplo
# https://radar-economico-api.onrender.com
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Consulta o /health
    if: vars.API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Até ~1 min para acordar, se ela tiver dormido: algumas tentativas.
      - run: curl -fsS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 "${{ vars.API_URL }}/health"
