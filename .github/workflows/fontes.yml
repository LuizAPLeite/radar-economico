name: Canário das fontes

# Todo dia às 7h30 de Brasília (10h30 UTC), e por disparo manual.
#
# Refaz o caminho inteiro contra as fontes reais, num Postgres temporário do
# próprio Actions: migrations → coleta (BCB e ANP) → pipeline → API. Se o BCB
# ou a ANP mudarem de formato (um CSV com colunas novas, um endpoint que
# mudou), algum passo falha e o GitHub avisa por e-mail no mesmo dia, antes
# de a coleta de produção dar problema. Não grava nada fora dele.
#
# O IBGE fica de fora: ele recusa conexões vindas de fora do Brasil (os
# servidores do Actions ficam nos EUA). Os municípios, de que o job da ANP
# precisa, vêm de um retrato em .github/canario/municipios.csv.gz. Para
# regerá-lo a partir do banco local (raramente necessário):
#   docker compose exec -T postgres psql -U radar -c "\copy (SELECT ibge_code, name, uf, latitude, longitude FROM staging.municipalities ORDER BY ibge_code) TO STDOUT WITH (FORMAT csv, HEADER)" | gzip -9n > .github/canario/municipios.csv.gz
on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:
  # Mudou o próprio canário: roda para conferir a mudança.
  push:
    branches: [main]
    paths: [.github/workflows/fontes.yml]

concurrency:
  group: canario-fontes
  cancel-in-progress: true

jobs:
  canary:
    name: Coleta, pipeline e API contra as fontes reais
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://radar:radar@localhost:5432/radar?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Migrations
        run: |
          docker run --rm --network host -v "$PWD/db/migrations:/migrations:ro" \
            migrate/migrate:v4.18.3 -path=/migrations -database="$DATABASE_URL" up

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      # Só os 2 últimos meses da ANP: o servidor deles é lento (~200 KB/s), e
      # para conferir o formato dos arquivos isso basta.
      # Os erros do coletor (logs em JSON) viram anotações: aparecem no topo da
      # página da execução, sem precisar abrir o log inteiro.
      - name: Coleta das fontes reais
        run: |
          export ANP_START_MONTH=$(date -u -d "$(date -u +%Y-%m-01) -2 months" +%Y-%m)
          echo "ANP a partir de $ANP_START_MONTH"
          set +e
          COLLECTOR_SOURCES=bcb_sgs,anp go run ./collector 2>&1 | tee collector.log
          status=${PIPESTATUS[0]}
          set -e
          grep '"level":"ERROR"' collector.log | jq -r '"::error::\(.msg): \(.err // "")"' | cut -c1-900 || true
          exit "$status"

      # No lugar do job do IBGE: as mesmas tabelas que ele grava.
      - name: Municípios do retrato
        run: |
          gunzip -c .github/canario/municipios.csv.gz |
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
              -c "\copy staging.municipalities (ibge_code, name, uf, latitude, longitude) FROM STDIN WITH (FORMAT csv, HEADER)"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO mart.municipalities (ibge_code, name, uf, latitude, longitude)
            SELECT ibge_code, name, uf, latitude, longitude FROM staging.municipalities
             WHERE latitude IS NOT NULL AND longitude IS NOT NULL"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Pipeline (raw → staging → mart)
        working-directory: pipeline
        run: PIPELINE_JOBS=bcb,anp uv run --locked --no-dev radar-pipeline

      # A API de verdade, sobre a mart recém-carregada: /health/data responde
      # 200 só se os quatro conjuntos estão em dia e nenhum job falhou.
      - name: API e saúde dos dados
        run: |
          go build -o "$RUNNER_TEMP/api" ./api
          PORT=8080 CACHE_TTL=0 "$RUNNER_TEMP/api" > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8080/health > /dev/null && break; sleep 1; done
          status=$(curl -s -o health.json -w "%{http_code}" localhost:8080/health/data)
          {
            echo "### Saúde dos dados: HTTP $status"
            echo '```json'
            jq . health.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          jq . health.json
          if [ "$status" != "200" ]; then
            echo "::error::/health/data respondeu $status"
            cat "$RUNNER_TEMP/api.log"
            exit 1
          fi
