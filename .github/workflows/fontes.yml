name: Canário das fontes

# Todo dia às 7h30 de Brasília (10h30 UTC), e por disparo manual.
#
# Refaz o caminho inteiro contra as fontes reais, num Postgres temporário do
# próprio Actions: migrations → coleta (BCB, IBGE e ANP) → pipeline → API.
# Se o BCB, o IBGE ou a ANP mudarem de formato (um CSV com colunas novas, um
# endpoint que mudou), algum passo falha e o GitHub avisa por e-mail no mesmo
# dia, antes de a coleta de produção dar problema. Não grava nada fora dele.
on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:
  # Mudou o próprio canário: roda para conferir a mudança.
  push:
    branches: [main]
    paths: [.github/workflows/fontes.yml]

concurrency:
  group: canario-fontes
  cancel-in-progress: true

jobs:
  canary:
    name: Coleta, pipeline e API contra as fontes reais
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://radar:radar@localhost:5432/radar?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Migrations
        run: |
          docker run --rm --network host -v "$PWD/db/migrations:/migrations:ro" \
            migrate/migrate:v4.18.3 -path=/migrations -database="$DATABASE_URL" up

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      # Só os 2 últimos meses da ANP: o servidor deles é lento (~200 KB/s), e
      # para conferir o formato dos arquivos isso basta.
      - name: Coleta das fontes reais
        run: |
          export ANP_START_MONTH=$(date -u -d "$(date -u +%Y-%m-01) -2 months" +%Y-%m)
          echo "ANP a partir de $ANP_START_MONTH"
          go run ./collector

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Pipeline (raw → staging → mart)
        working-directory: pipeline
        run: uv run --locked --no-dev radar-pipeline

      # A API de verdade, sobre a mart recém-carregada: /health/data responde
      # 200 só se os quatro conjuntos estão em dia e nenhum job falhou.
      - name: API e saúde dos dados
        run: |
          go build -o "$RUNNER_TEMP/api" ./api
          PORT=8080 CACHE_TTL=0 "$RUNNER_TEMP/api" > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8080/health > /dev/null && break; sleep 1; done
          status=$(curl -s -o health.json -w "%{http_code}" localhost:8080/health/data)
          {
            echo "### Saúde dos dados: HTTP $status"
            echo '```json'
            jq . health.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          jq . health.json
          if [ "$status" != "200" ]; then
            echo "::error::/health/data respondeu $status"
            cat "$RUNNER_TEMP/api.log"
            exit 1
          fi
