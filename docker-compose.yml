name: radar-economico

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar}
      POSTGRES_DB: ${POSTGRES_DB:-radar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Aplica as migrations e encerra. Roda de novo a cada `docker compose up`
  # (é idempotente: o golang-migrate só aplica o que ainda não foi aplicado).
  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@postgres:5432/${POSTGRES_DB:-radar}?sslmode=disable
      - up
    restart: "no"

  # Liga o login do usuário da API (radar_api, migration 000009) com uma senha
  # de desenvolvimento e encerra. Em produção, a senha é definida uma vez,
  # fora do git (ver README, Segurança). Roda de novo a cada `up`: idempotente.
  db-users:
    image: postgres:16-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-radar}
    command:
      - psql
      - --host=postgres
      - --username=${POSTGRES_USER:-radar}
      - --dbname=${POSTGRES_DB:-radar}
      - --set=ON_ERROR_STOP=1
      - --command=ALTER ROLE radar_api LOGIN PASSWORD '${RADAR_API_PASSWORD:-radar_api}'
    restart: "no"

  # Coleta as séries do Banco Central uma vez e encerra.
  collector:
    build: ./collector
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@postgres:5432/${POSTGRES_DB:-radar}?sslmode=disable
      SGS_START_DATE: ${SGS_START_DATE:-2000-01-01}
      SGS_FULL_HISTORY: ${SGS_FULL_HISTORY:-}
      COLLECTOR_CONCURRENCY: ${COLLECTOR_CONCURRENCY:-4}
      COLLECTOR_SOURCES: ${COLLECTOR_SOURCES:-}
      ANP_START_MONTH: ${ANP_START_MONTH:-}
    restart: "no"

  # Lê a coleta mais recente do raw e grava staging e mart. Roda depois do
  # collector, mas os dois só conversam pelo banco: o pipeline também
  # funciona sozinho, sobre o que já estiver no raw.
  pipeline:
    build: ./pipeline
    depends_on:
      collector:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@postgres:5432/${POSTGRES_DB:-radar}?sslmode=disable
      PIPELINE_JOBS: ${PIPELINE_JOBS:-}
      PIPELINE_FULL_REFRESH: ${PIPELINE_FULL_REFRESH:-}
    restart: "no"

  # API REST somente leitura sobre a mart. Só precisa das tabelas existirem:
  # sobe mesmo antes do pipeline e passa a servir os dados quando eles chegam.
  api:
    build: ./api
    depends_on:
      db-users:
        condition: service_completed_successfully
    environment:
      # A API conecta como radar_api, que só lê a mart (como em produção), e
      # não como o dono do banco: ver o achado AM-01 em docs/security.
      DATABASE_URL: postgres://radar_api:${RADAR_API_PASSWORD:-radar_api}@postgres:5432/${POSTGRES_DB:-radar}?sslmode=disable
      PORT: "8080"
      # Cache curto no desenvolvimento: o que o pipeline grava aparece em até
      # 1 minuto. Em produção vale 30m (render.yaml).
      CACHE_TTL: ${CACHE_TTL:-1m}
      # Assistente (POST /v1/ask): sem a chave, fica desligado. A chave vem
      # do .env (nunca do repositório).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      ASSISTANT_DAILY_LIMIT: ${ASSISTANT_DAILY_LIMIT:-400}
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  # Dashboard. O servidor do Next chama a API pela rede interna do Compose;
  # o navegador só fala com o Next.
  web:
    build: ./web
    depends_on:
      - api
    environment:
      API_URL: http://api:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
