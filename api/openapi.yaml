openapi: 3.1.0
info:
  title: Radar Econômico API
  version: 0.1.0
  description: |
    API REST somente leitura com indicadores econômicos do Brasil.

    Os dados vêm do Banco Central (API SGS), da ANP (preços de combustíveis),
    do IBGE (municípios) e do FRED (petróleo Brent), passam pelo pipeline
    raw → staging → mart e são servidos a partir do schema `mart`.
    Todas as respostas de erro seguem o formato `Error`.
servers:
  - url: http://localhost:8080
    description: Desenvolvimento local (docker compose)

paths:
  /health:
    get:
      operationId: health
      summary: Verifica se a API está no ar
      responses:
        "200":
          description: API no ar
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /health/data:
    get:
      operationId: healthData
      summary: Verifica se os dados estão em dia
      description: |
        Para cada conjunto de dados, a data do dado mais recente e se ela está
        dentro do prazo esperado para a fonte (que considera fins de semana,
        feriados e o atraso de publicação). Também traz a última execução de
        cada job do pipeline e os avisos de qualidade da última carga.

        Responde 200 quando está tudo em dia, e 503 quando algum conjunto
        atrasou ou está vazio, ou quando a última execução de algum job falhou,
        para servir a um monitor externo. O corpo é o mesmo nos dois casos.
        A leitura do banco passa pelo cache da API (CACHE_TTL), mas a idade dos
        dados é calculada a cada requisição.
      responses:
        "200":
          description: Todos os dados em dia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
        "503":
          description: Algum conjunto atrasado ou vazio, ou um job com falha
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/indicators:
    get:
      operationId: listIndicators
      summary: Lista os indicadores, cada um com o valor mais recente
      responses:
        "200":
          description: Indicadores disponíveis
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/IndicatorWithLatest"
              example:
                data:
                  - id: usd_brl
                    name: Dólar comercial (venda)
                    unit: R$/US$
                    frequency: daily
                    source: BCB
                    source_code: "1"
                    updated_at: "2026-11-07T18:39:18Z"
                    latest:
                      date: "2026-11-06"
                      value: 5.5013
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/indicators/{id}/values:
    get:
      operationId: listIndicatorValues
      summary: Série histórica de um indicador
      description: |
        Valores em ordem cronológica. Sem `from` e `to`, devolve a série inteira
        (a mais longa, a meta Selic, tem um valor por dia desde 2000).
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador do indicador
          schema:
            type: string
            examples: [selic, ipca, usd_brl]
        - name: from
          in: query
          description: Data inicial, inclusiva (AAAA-MM-DD)
          schema:
            type: string
            format: date
            examples: ["2026-01-01"]
        - name: to
          in: query
          description: Data final, inclusiva (AAAA-MM-DD)
          schema:
            type: string
            format: date
            examples: ["2026-11-07"]
      responses:
        "200":
          description: Série do indicador no intervalo pedido (pode ser vazia)
          content:
            application/json:
              schema:
                type: object
                required: [indicator, data]
                properties:
                  indicator:
                    $ref: "#/components/schemas/Indicator"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Point"
              example:
                indicator:
                  id: usd_brl
                  name: Dólar comercial (venda)
                  unit: R$/US$
                  frequency: daily
                  source: BCB
                  source_code: "1"
                  updated_at: "2026-11-07T18:39:18Z"
                data:
                  - date: "2026-11-05"
                    value: 5.4621
                  - date: "2026-11-06"
                    value: 5.5013
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/fuels:
    get:
      operationId: listFuels
      summary: Lista os combustíveis, cada um com a média nacional mais recente
      description: |
        Preços de revenda pesquisados pela ANP nos postos (gasolina, etanol,
        diesel e GNV). A média é simples, sobre todos os postos da semana.
      responses:
        "200":
          description: Combustíveis disponíveis
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FuelWithLatest"
              example:
                data:
                  - id: gasolina
                    name: Gasolina comum
                    unit: R$/l
                    updated_at: "2026-11-07T19:00:00Z"
                    latest:
                      week_start: "2026-10-26"
                      avg_price: 6.505
                      n_stations: 4560
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/fuels/{id}/prices:
    get:
      operationId: listFuelPrices
      summary: Preço médio semanal de um combustível, no Brasil ou numa UF
      description: |
        Uma média por semana (a semana começa na segunda-feira), em ordem
        cronológica. A série pode ter buracos: semanas sem pesquisa ou com
        menos da metade dos postos de costume (ex.: um mês que a ANP não
        publicou) ficam de fora, em vez de virar um ponto pouco confiável.
      parameters:
        - $ref: "#/components/parameters/FuelID"
        - name: scope
          in: query
          description: "`BR` (padrão) ou a sigla de uma UF; aceita minúsculas"
          schema:
            type: string
            examples: [BR, SP]
        - name: from
          in: query
          description: Primeira semana, inclusiva (AAAA-MM-DD)
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Última semana, inclusiva (AAAA-MM-DD)
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Série semanal (pode ser vazia)
          content:
            application/json:
              schema:
                type: object
                required: [fuel, scope, data]
                properties:
                  fuel:
                    $ref: "#/components/schemas/Fuel"
                  scope:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WeekPrice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/fuels/{id}/municipalities:
    get:
      operationId: listFuelMunicipalities
      summary: Preço de um combustível em cada município pesquisado, num mês
      description: |
        Dados para o mapa: média, mínimo e máximo do mês em cada município,
        com as coordenadas do centroide (IBGE). A ANP pesquisa ~400 dos 5.570
        municípios. Sem `month`, usa o mês mais recente; `available_months`
        lista os meses com dados.
      parameters:
        - $ref: "#/components/parameters/FuelID"
        - name: month
          in: query
          description: Mês (AAAA-MM). Padrão, o mais recente com dados.
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
            examples: ["2026-10"]
      responses:
        "200":
          description: Preços por município no mês
          content:
            application/json:
              schema:
                type: object
                required: [fuel, month, available_months, data]
                properties:
                  fuel:
                    $ref: "#/components/schemas/Fuel"
                  month:
                    type: [string, "null"]
                    description: Mês mostrado (null se o combustível não tem dados)
                  available_months:
                    type: array
                    items:
                      type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MunicipalPrice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/fuels/{id}/pass-through:
    get:
      operationId: getFuelPassThrough
      summary: Quanto o preço na bomba acompanha o dólar e o petróleo
      description: |
        Correlação entre a variação em 4 semanas do preço médio no Brasil
        (série oficial da ANP) e a variação, `lag_weeks` semanas antes, de
        cada fator: dólar (`usd_brl`), Brent em US$ (`brent_usd`) e Brent em
        reais (`brent_brl`). Separada pelos períodos da política de preços
        da Petrobras (`regimes`), com a correlação móvel de 52 semanas na
        defasagem de maior correlação do período atual. Calculada pelo
        pipeline (job `analysis`).
      parameters:
        - $ref: "#/components/parameters/FuelID"
      responses:
        "200":
          description: Correlações por período e defasagem, e a correlação móvel
          content:
            application/json:
              schema:
                type: object
                required: [fuel, regimes, lags, rolling]
                properties:
                  fuel:
                    $ref: "#/components/schemas/Fuel"
                  regimes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Regime"
                  lags:
                    type: array
                    items:
                      $ref: "#/components/schemas/LagCorrelation"
                  rolling:
                    type: array
                    items:
                      $ref: "#/components/schemas/RollingCorrelation"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/fuels/{id}/forecast:
    get:
      operationId: getFuelForecast
      summary: Previsão do preço médio no Brasil para as próximas semanas
      description: |
        Previsão de 1 a 8 semanas à frente com intervalo de 80%, feita pelo
        modelo de menor erro no teste com as últimas 104 semanas
        (`backtests`): `naive` (o preço fica igual) ou `brent` (regressão
        sobre a variação recente do Brent em reais). `history` traz as
        últimas 104 semanas da série oficial da ANP. Sem previsão calculada,
        `model` e `base_week` são null e as listas vêm vazias.
      parameters:
        - $ref: "#/components/parameters/FuelID"
      responses:
        "200":
          description: Previsão, histórico recente e erro dos modelos
          content:
            application/json:
              schema:
                type: object
                required: [fuel, model, base_week, history, forecasts, backtests]
                properties:
                  fuel:
                    $ref: "#/components/schemas/Fuel"
                  model:
                    type: [string, "null"]
                    description: Modelo publicado
                    examples: [naive]
                  base_week:
                    type: [string, "null"]
                    format: date
                    description: Última semana observada quando a previsão foi feita
                  history:
                    type: array
                    items:
                      $ref: "#/components/schemas/WeekPrice"
                  forecasts:
                    type: array
                    items:
                      $ref: "#/components/schemas/ForecastPoint"
                  backtests:
                    type: array
                    items:
                      $ref: "#/components/schemas/Backtest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/ask:
    post:
      operationId: ask
      summary: Pergunta em português sobre os dados (assistente com LLM)
      description: |
        Um modelo de linguagem (Gemini) transforma a pergunta numa consulta
        SQL sobre a mart; a API confere a consulta (um único SELECT, sem
        comentários), executa num papel do Postgres que só lê algumas tabelas,
        numa transação somente leitura, com tempo máximo de 3 s e até 500
        linhas, e devolve os dados, o SQL usado e uma sugestão de gráfico.
        Respostas iguais ficam guardadas por 24 h (`cached`); perguntas novas
        têm um limite por dia. `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              additionalProperties: false
              properties:
                question:
                  type: string
                  minLength: 3
                  maxLength: 300
                  examples: ["Como o preço da gasolina variou desde 2020?"]
      responses:
        "200":
          description: Resposta (com dados, ou explicando por que os dados não respondem)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Answer"
        "400":
          description: Corpo ou pergunta inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: O modelo não montou uma consulta válida para a pergunta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Limite de perguntas do dia (ou cota do modelo) atingido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: O provedor do modelo de linguagem falhou
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Assistente desligado neste servidor (sem chave do modelo)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    FuelID:
      name: id
      in: path
      required: true
      description: Identificador do combustível
      schema:
        type: string
        enum: [gasolina, gasolina_aditivada, etanol, diesel, diesel_s10, gnv]

  schemas:
    Indicator:
      type: object
      required: [id, name, unit, frequency, source, source_code, updated_at]
      properties:
        id:
          type: string
          examples: [usd_brl]
        name:
          type: string
          examples: [Dólar comercial (venda)]
        unit:
          type: string
          examples: [R$/US$]
        frequency:
          type: string
          enum: [daily, monthly]
        source:
          type: string
          description: Instituição de origem
          examples: [BCB]
        source_code:
          type: string
          description: Código da série na fonte (no BCB, o código do SGS)
          examples: ["1"]
        updated_at:
          type: string
          format: date-time
          description: Quando o pipeline atualizou os dados deste indicador (UTC)

    IndicatorWithLatest:
      allOf:
        - $ref: "#/components/schemas/Indicator"
        - type: object
          required: [latest]
          properties:
            latest:
              $ref: "#/components/schemas/Point"

    Point:
      type: object
      required: [date, value]
      properties:
        date:
          type: string
          format: date
        value:
          type: number

    Fuel:
      type: object
      required: [id, name, unit, updated_at]
      properties:
        id:
          type: string
          examples: [gasolina]
        name:
          type: string
          examples: [Gasolina comum]
        unit:
          type: string
          description: "R$/l, ou R$/m³ para o GNV"
          examples: [R$/l]
        updated_at:
          type: string
          format: date-time
          description: Quando o pipeline atualizou os preços (UTC)

    FuelWithLatest:
      allOf:
        - $ref: "#/components/schemas/Fuel"
        - type: object
          required: [latest]
          properties:
            latest:
              $ref: "#/components/schemas/WeekPrice"

    WeekPrice:
      type: object
      required: [week_start, avg_price, n_stations]
      properties:
        week_start:
          type: string
          format: date
          description: Segunda-feira da semana
        avg_price:
          type: number
        n_stations:
          type: integer
          description: Postos pesquisados na semana

    MunicipalPrice:
      type: object
      required: [ibge_code, name, uf, latitude, longitude, avg_price, min_price, max_price, n_stations]
      properties:
        ibge_code:
          type: integer
          description: Código do município no IBGE (7 dígitos)
          examples: [3550308]
        name:
          type: string
          examples: [São Paulo]
        uf:
          type: string
          examples: [SP]
        latitude:
          type: number
        longitude:
          type: number
        avg_price:
          type: number
        min_price:
          type: number
        max_price:
          type: number
        n_stations:
          type: integer
          description: Postos pesquisados no mês

    Regime:
      type: object
      required: [id, name, starts_on, ends_on, description]
      properties:
        id:
          type: string
          examples: [ppi]
        name:
          type: string
          examples: [Paridade internacional (2016–2023)]
        starts_on:
          type: string
          format: date
        ends_on:
          type: [string, "null"]
          format: date
          description: Fim (exclusivo); null no período atual
        description:
          type: string

    LagCorrelation:
      type: object
      required: [driver, regime_id, lag_weeks, correlation, n_weeks]
      properties:
        driver:
          type: string
          enum: [usd_brl, brent_usd, brent_brl]
        regime_id:
          type: string
        lag_weeks:
          type: integer
          minimum: 0
          description: Semanas entre a variação do fator e a do preço
        correlation:
          type: number
          minimum: -1
          maximum: 1
        n_weeks:
          type: integer
          description: Pares de semanas usados no cálculo

    RollingCorrelation:
      type: object
      required: [driver, week_start, lag_weeks, correlation]
      properties:
        driver:
          type: string
          enum: [usd_brl, brent_usd, brent_brl]
        week_start:
          type: string
          format: date
          description: Última semana da janela de 52 semanas
        lag_weeks:
          type: integer
          minimum: 0
        correlation:
          type: number
          minimum: -1
          maximum: 1

    ForecastPoint:
      type: object
      required: [week_start, horizon_weeks, predicted, lower_80, upper_80]
      properties:
        week_start:
          type: string
          format: date
        horizon_weeks:
          type: integer
          minimum: 1
        predicted:
          type: number
        lower_80:
          type: number
        upper_80:
          type: number

    Backtest:
      type: object
      required: [model, horizon_weeks, mae, mape, n_forecasts]
      properties:
        model:
          type: string
          examples: [naive]
        horizon_weeks:
          type: integer
          minimum: 1
        mae:
          type: number
          description: Erro absoluto médio, na unidade do combustível (R$)
        mape:
          type: number
          description: Erro percentual médio (%)
        n_forecasts:
          type: integer

    Answer:
      type: object
      required: [question, answerable, title, explanation, sql, chart, columns, rows, truncated, cached]
      properties:
        question:
          type: string
        answerable:
          type: boolean
          description: false quando os dados não respondem à pergunta (sql vazio, sem linhas)
        title:
          type: string
        explanation:
          type: string
          description: O que a consulta mostra, escrito pelo modelo, em português
        sql:
          type: string
          description: A consulta executada (vazia se answerable é false)
        chart:
          type: object
          required: [type, x, y]
          properties:
            type:
              type: string
              enum: [line, bar, none]
            x:
              type: string
              description: Coluna do eixo X (vazia em none)
            y:
              type: array
              items:
                type: string
        columns:
          type: array
          items:
            type: object
            required: [name, type]
            properties:
              name:
                type: string
              type:
                type: string
                enum: [date, number, text]
        rows:
          type: array
          description: Linhas do resultado; datas como AAAA-MM-DD, números como número, NULL como null
          items:
            type: array
            items:
              type: [string, number, boolean, "null"]
        truncated:
          type: boolean
          description: true quando havia mais de 500 linhas
        cached:
          type: boolean
          description: true quando a resposta veio do cache (sem gastar a cota do modelo)

    HealthReport:
      type: object
      required: [status, checked_at, datasets, jobs]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checked_at:
          type: string
          format: date-time
        datasets:
          type: array
          items:
            $ref: "#/components/schemas/DatasetHealth"
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/JobHealth"

    DatasetHealth:
      type: object
      required: [id, name, latest, age_days, max_age_days, status]
      properties:
        id:
          type: string
          enum: [selic, usd_brl, ipca, fuels, brent, fuels_series]
        name:
          type: string
          examples: [Meta Selic]
        latest:
          type: [string, "null"]
          format: date
          description: Data do dado mais recente; null quando não há dados
        age_days:
          type: [integer, "null"]
          description: Dias desde o dado mais recente, no horário de Brasília
        max_age_days:
          type: integer
          description: Prazo da fonte; acima dele, o conjunto está atrasado
        status:
          type: string
          enum: [ok, stale, missing]

    JobHealth:
      type: object
      required: [job, last_status, last_run_at, last_success_at, collected_at, warnings]
      properties:
        job:
          type: string
          examples: [anp]
        last_status:
          type: string
          enum: [success, skipped, failed]
          description: Resultado da última execução (skipped = nada novo no raw)
        last_run_at:
          type: string
          format: date-time
        last_success_at:
          type: [string, "null"]
          format: date-time
          description: Fim da última carga que deu certo; null se nunca deu
        collected_at:
          type: [string, "null"]
          format: date-time
          description: Quando a fonte usada na última carga foi coletada
        warnings:
          type: array
          items:
            type: string
          description: Avisos de qualidade da última carga (não impediram a carga)

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Código estável, para programas
              examples: [not_found]
            message:
              type: string
              description: Descrição para pessoas, em português

  responses:
    BadRequest:
      description: Parâmetro inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_parameter
              message: 'parâmetro from inválido ("07/11/2026"): use AAAA-MM-DD'
    NotFound:
      description: Indicador ou rota inexistente
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: indicador "xyz" não encontrado
    InternalError:
      description: Erro interno (o detalhe fica só no log do servidor)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: internal
              message: erro interno; tente novamente
